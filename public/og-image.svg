<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow orbs -->
  <circle cx="1050" cy="150" r="220" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="260" fill="#a855f7" opacity="0.2" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Decorative grid lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Brand Badge Top Left -->
  <g transform="translate(80, 70)">
    <rect width="70" height="70" rx="20" fill="url(#brand)" />
    <text x="35" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">E5</text>
    
    <g transform="translate(90, 8)">
      <rect width="260" height="32" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
      <text x="130" y="21" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-size="14" font-weight="700" fill="#fde047" text-anchor="middle">NCTB ২০২৬ নতুন পাঠ্যক্রম</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#c7d2fe">English for Today (Class Five)</text>
    </g>
  </g>

  <!-- Main Headline -->
  <text x="80" y="245" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-size="54" font-weight="800" fill="#ffffff">
    ৫ম শ্রেণি ইংরেজি পাঠশালা
  </text>

  <!-- Subheadline -->
  <text x="80" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Complete 20 Units Solution • Native Voice Audio • Creative Exam Lab • AI Tutor
  </text>

  <!-- Feature Pills Grid -->
  <g transform="translate(80, 360)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="52" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="24" y="32" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700" fill="#ffffff">📚 ২০টি পূর্ণাঙ্গ ইউনিট</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(260, 0)">
      <rect width="250" height="52" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="24" y="32" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700" fill="#ffffff">🔊 সঠিক অডিও উচ্চারণ</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(530, 0)">
      <rect width="250" height="52" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="24" y="32" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700" fill="#ffffff">✍️ সৃজনশীল প্রশ্ন ও প্যাসেজ</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(800, 0)">
      <rect width="240" height="52" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="24" y="32" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700" fill="#ffffff">💡 ব্যাকরণ ও শব্দার্থ</text>
    </g>

    <!-- Pill 5 (Bottom) -->
    <g transform="translate(0, 72)">
      <rect width="320" height="52" rx="16" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="24" y="32" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="800" fill="#fde047">🤖 Groq AI চালিত ইংলিশ বন্ধু</text>
    </g>

    <!-- Pill 6 (Bottom) -->
    <g transform="translate(340, 72)">
      <rect width="260" height="52" rx="16" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <text x="24" y="32" font-family="'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700" fill="#6ee7b7">🖨️ A4 প্রিন্ট উপযোগী প্রশ্নপত্র</text>
    </g>
  </g>

  <!-- Bottom Bar: URL & License -->
  <g transform="translate(80, 560)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#818cf8">
      jqsafi.github.io/class5-english-bangla
    </text>
    <text x="1040" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="end">
      Open Source • Free for All Students &amp; Teachers
    </text>
  </g>
</svg>
